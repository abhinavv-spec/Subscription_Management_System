</label>

<input autocomplete="username" class="w-full bg-transparent font-body-md text-body-md text-on-surface focus:outline-none placeholder:text-outline" placeholder="admin.ops@brightloop.io" type="email" value="admin.ops@brightloop.io">

        </span>

<!-- Inline Script for Password Visibility Micro-interaction -->
<script>
    (function() {
      const toggleBtn = document.getElementById('toggle-visibility-btn');
      const passInput = document.getElementById('admin-pass');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (toggleBtn && passInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passInput.getAttribute('type') === 'password';
          passInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
          passInput.classList.toggle('tracking-widest', !isPassword);
        });
      }
    })();

    function handleAdminSubmit() {
      const btn = document.getElementById('admin-submit-btn');
      if (!btn) return;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span><span>Verifying Cryptographic Root Key...</span>';
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">verified</span><span>Root Console Initialized</span>';
        btn.classList.remove('bg-primary-container', 'text-on-primary-container');
        btn.classList.add('bg-emerald-400', 'text-slate-950');

        try {
          var audits = JSON.parse(localStorage.getItem('brightloop_audit_logs') || '[]');
          audits.unshift({
            id: 'AUD-' + Math.floor(100 + Math.random() * 900),
            actor: 'Admin: Root Key Operator',
            action: 'Administrative Root Key Verified & Console Initialized',
            target: 'Root Console',
            time: 'Just now',
            ip: '10.240.12.8',
            level: 'SECURITY'
          });
          localStorage.setItem('brightloop_audit_logs', JSON.stringify(audits));
        } catch(e) {}

        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 500);
      }, 700);
    }
  </script>
