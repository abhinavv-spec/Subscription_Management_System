solute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-lowest/40 via-background to-background"></div></div><header class="relative z-20 w-full px-margin-mobile md:px-margin pt-space-lg flex items-center justify-between">

    <div class="w-9 h-9 rounded-full bg-surface-container-high/80 border border-primary/30 backdrop-blur-xl flex items-center justify-center shadow-[0_0_16px_rgba(56,189,248,0.25)] group-hover:border-primary transition-colors">
      <span class="material-symbols-outlined text-primary text-[20px]">all_inclusive</span>

  </a>
  <div class="flex items-center gap-2">
    <a href="cust_login.html" class="px-3.5 py-1.5 rounded-full bg-surface-container/60 hover:bg-surface-container text-on-surface-variant hover:text-on-surface text-xs font-semibold transition-all flex items-center gap-1.5 border border-primary/20 hover:border-primary/40">
      <span class="material-symbols-outlined text-[16px] text-primary">person</span>
      <span>Customer Portal</span>
    </a>
    <a href="admin_login.html" class="px-3 py-1.5 rounded-full bg-surface-container/40 hover:bg-surface-container text-on-surface-variant hover:text-on-surface text-xs font-medium transition-colors flex items-center gap-1.5">
      <span class="material-symbols-outlined text-[16px] text-primary">shield_person</span>
      <span>Admin Console</span>
    </a>
  </div>
</header><main class="relative z-10 w-full min-h-[calc(100vh-5rem)] flex items-center justify-center p-gutter-mobile md:p-gutter"><div class="flex flex-col w-full">
<div class="relative w-full max-w-lg mx-auto flex flex-col items-center justify-center py-space-sm sm:py-space-md">
<!-- Atmospheric Celestial Light Horizon Arc Behind Card -->
<div class="pointer-events-none absolute -top-28 sm:-top-32 left-1/2 -translate-x-1/2 w-[160%] sm:w-[580px] h-[240px] overflow-hidden flex items-center justify-center">
<div class="absolute w-[440px] sm:w-[500px] h-[340px] rounded-[50%] bg-gradient-to-b from-primary/30 via-tertiary-container/10 to-transparent blur-2xl"></div>
<svg class="w-[520px] h-[260px] text-primary/70 shrink-0" fill="none" viewbox="0 0 520 260" xmlns="http://www.w3.org/2000/svg">
<path class="opacity-80" d="M 20 230 C 130 60, 390 60, 500 230" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path>
<path class="opacity-40 blur-sm" d="M 50 220 C 150 90, 370 90, 470 220" stroke="url(#arcGlow)" stroke-linecap="round" stroke-width="4"></path>
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="arcGlow" x1="50" x2="470" y1="220" y2="220">
<stop stop-color="#38bdf8" stop-opacity="0.1"></stop>
<stop offset="0.5" stop-color="#8ed5ff" stop-opacity="0.9"></stop>
<stop offset="1" stop-color="#38bdf8" stop-opacity="0.1"></stop>
</lineargradient>
</defs>
</svg>
<div class="absolute top-[88px] w-2 h-2 rounded-full bg-on-background shadow-[0_0_14px_4px_rgba(142,213,255,0.9)] animate-pulse"></div>
</div>
<!-- Centered Glassmorphic Portal Container -->
<div class="relative w-full rounded-lg bg-surface-container-low/85 backdrop-blur-2xl shadow-xl shadow-surface-container-lowest/80 p-6 sm:p-9 flex flex-col items-center">
<!-- Top Subtle Horizon Inner Glow Overlay -->
<div class="pointer-events-none absolute inset-x-0 top-0 h-28 rounded-t-lg bg-gradient-to-b from-primary-container/10 via-primary-container/0 to-transparent"></div>
<!-- Identification Badge Circular Icon -->
<div class="relative mb-4 flex items-center justify-center">
<div class="absolute -inset-1 rounded-full bg-primary/20 blur-md"></div>
<div class="relative w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center shadow-md shadow-surface-container-lowest/50">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">badge</span>
</div>
</div>
<!-- Pill Badge: Internal Operations -->
<div class="mb-3 px-3.5 py-1 rounded-full bg-surface-container-highest/80 flex items-center gap-1.5 shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-ping"></span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-primary">Internal Operations</span>
</div>
<!-- Headline & Subtitle -->
<h1 class="font-headline-md text-headline-md text-on-surface text-center tracking-tight">Staff Login Gateway</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-1.5 mb-7">Authenticate with verified internal credentials.</p>
<!-- Sign-In Form -->
<form class="w-full flex flex-col gap-4" id="staff-login-form" onsubmit="event.preventDefault(); handleStaffSubmit();">
<!-- Field 1: Staff Email / Employee ID -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="staff-id">
<span>Staff Email / Employee ID</span>
<span class="font-label-sm text-label-sm text-on-surface-variant/70">Corp ID</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant/70 text-[20px] pointer-events-none">alternate_email</span>
<input autocomplete="username" class="w-full pl-11 pr-4 py-2.5 rounded bg-surface-container-lowest text-on-surface placeholder:text-outline/60 font-body-md text-body-md transition-all duration-200 focus:outline-none focus:bg-surface-container-low shadow-sm" id="staff-id" name="staff-id" placeholder="sarah@brightloop.io" required="" type="text" value="sarah@brightloop.io"/>
</div>
</div>
<!-- Field 2: Password -->
<div class="flex flex-col gap-1.5 text-left">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="staff-password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot credentials?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant/70 text-[20px] pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full pl-11 pr-11 py-2.5 rounded bg-surface-container-lowest text-on-surface placeholder:text-outline/60 font-body-md text-body-md transition-all duration-200 focus:outline-none focus:bg-surface-container-low shadow-sm" id="staff-password" name="staff-password" placeholder="••••••••••••" required="" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-on-surface-variant/70 hover:text-on-surface transition-colors flex items-center justify-center" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button: Glowing Cyan Pill -->
<div class="relative mt-2">
<button class="relative w-full py-3 px-6 rounded-full bg-primary-container text-on-primary-container font-title-md text-title-md font-semibold tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-primary-container/25 hover:shadow-primary-container/40 active:scale-[0.99] transition-all duration-200 overflow-hidden group cursor-pointer" id="submit-btn" type="submit">
<span class="relative z-10 transition-transform duration-200 group-hover:translate-x-0.5">Sign In to Staff Gateway</span>
<span class="material-symbols-outlined text-[20px] relative z-10 transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
</div>
</form>
<!-- Sub-Notice Footprint -->
<div class="mt-6 flex items-center justify-center gap-2 text-center text-on-surface-variant/80">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-body-sm text-body-sm tracking-tight">Internal Network Access • Audit Logged • TLS 1.3</span>
</div>
</div>
</div>
<script>
    function togglePasswordVisibility() {
      var passInput = document.getElementById('staff-password');
      var eyeIcon = document.getElementById('password-eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }

    function handleStaffSubmit() {
      var btn = document.getElementById('submit-btn');
      var originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Authenticating...</span>';
      setTimeout(function() {
        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Access Granted</span>';
        btn.classList.remove('bg-primary-container', 'text-on-primary-container');
        btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
        var emailInput = document.getElementById('staff-id');
        if (emailInput && emailInput.value) {
          sessionStorage.setItem('brightloop_active_staff_email', emailInput.value.trim());

          try {
            var audits = JSON.parse(localStorage.getItem('brightloop_audit_logs') || '[]');
            audits.unshift({
              id: 'AUD-' + Math.floor(100 + Math.random() * 900),
              actor: 'Staff: ' + emailInput.value.trim(),
              action: 'Staff Operations Terminal Session Authenticated',
              target: 'Shift Station',
              time: 'Just now',
              ip: '10.0.4.88',
              level: 'SUCCESS'
            });
            localStorage.setItem('brightloop_audit_logs', JSON.stringify(audits));
          } catch(e) {}
        }
        setTimeout(function() {
          window.location.href = 'staff.html';
        }, 500);
      }, 800);
    }
  </script>
</div></main></body></html>
